    # epistemic_threshold / cvar_boundary: recalibrated 2026-08-22 to match
    # the RETRAINED checkpoint (aleatoric head fix -- penn.py's log_std_max
    # clamp widened from -2 to 3.6, since the old ceiling sat ~275x below
    # the training targets' scale and pinned sigma near-constant regardless
    # of scene; see penn.py's comment and nn_model/checkpoint's retrain
    # notes). Values below are from this retrain's
    # cccp_threshold_Quadrotor3D_gat.json, not the pre-retrain checkpoint's.
    # cvar_boundary's sign convention: LOWER bound on predicted min_h
    # (low/negative=dangerous) -- see cccp_calibrate_drone.py's
    # collect_aleatoric_boundary() and penn_gamma_selector.cpp's
    # selectGamma(). Re-run nn_model/cccp_calibrate_drone.py and update all
    # three values here (plus lcb_k below) after every retrain; none of them
    # are portable across checkpoints.
    # UPDATED 2026-08-24 for the promoted widerange checkpoint (was 0.106508 /
    # 0.0122, the narrow-range retrain's values) -- see
    # nn_model/checkpoint/cccp_threshold_Quadrotor3D_gat_widerange.json.
    # UPDATED 2026-08-27 from penn_gat_training/nn_model/checkpoint/
    # cccp_threshold_gat_penn_clean_20260826.json (Phase 2 retrain,
    # gat_penn_clean_20260826.pth) -- the two values below are from that
    # file's raw_epistemic_threshold/cvar_boundary, alpha_cal=0.95. Prior
    # values here (0.10687255859375 / 0.0023882027249783394) belonged to
    # the superseded widerange checkpoint and are not portable.
    epistemic_threshold: 0.2608060836791992
    cvar_boundary: 0.3134114742279059
    # lcb_k: lower-confidence-bound weight on the risk head's predicted
    # min_h (mean_risk -= lcb_k*sqrt(var_al+var_ep) before gating -- see
    # penn_gamma_selector.hpp's GammaSelectionParams::lcb_k).
    #
    # diag_lcb_cv.py's point-mass-only sweep (2026-08-22) initially selected
    # lcb_k=1.50 (min margin-violations among 0-hard-collision candidates,
    # 6 calibration / 7 test seeds). Deploying that on the ACTUAL body-rate
    # controller (client_lib/tools/body_rate_closed_loop_diag.cpp's seeded
    # campaign, 7 seeds x 50 scenes x 4 arms = 1400 episodes) made deadlocks
    # WORSE (14/350 -> 22/350) and speed worse (+2.3% -> -2.1% paired vs
    # best-fixed-per-seed) than lcb_k=0, with no hard-collision benefit
    # either way (0/350 throughout) -- the point-mass calibration never saw
    # body-rate dynamics' deadlock failure mode, so it couldn't select
    # against it. A follow-up sweep directly on the closed-loop campaign
    # (LCB_K=0,0.25,0.5,0.75,1.0,1.5) found lcb_k=0.25 ties lcb_k=0 for
    # fewest deadlocks (14/350) while cutting margin-violations 8->6/350 --
    # real, measurable safety work from the aleatoric gate at negligible
    # cost, unlike every larger value tested. This IS the value that makes
    # "uncertainty-calibrated" true on the system that actually deploys,
    # not just on the point-mass proxy it was first calibrated against. See
    # results/frozen_closed_loop_20260822/MANIFEST.md for the full sweep.
    # UPDATE 2026-08-23: re-selected at the new penn_gamma_min/max=[1.3,3.0]
    # above. At that range the raised gamma FLOOR already eliminates the
    # soft-margin grazing lcb_k=0.25 was selected to fix (0-1 violations per
    # 300 at every lcb_k tested, not just 0.25) -- so the only remaining
    # signal is deadlock count, which favors k=0 (13/300 vs 18-22/300 for
    # k>=0.25, directionally consistent across all 5 comparisons though no
    # single one clears p<0.05 individually; sign test p=0.0625). This makes
    # the aleatoric/LCB gate INACTIVE at inference (a no-op), unlike the old
    # range where it was doing real, measurable work. Point-mass stage-1
    # re-sweep at the new range picked 0.75 instead (grazing is still a
    # point-mass failure mode) -- the two stages disagree because each
    # simulator can only see the failure mode the OTHER range change fixed
    # or didn't. k=0 was chosen because the deployed system (closed-loop)
    # took priority over the proxy (point-mass) when the two disagree. This
    # is a genuine, not cosmetic, weakening of the "uncertainty-calibrated"
    # claim -- see PAPER_FINAL.md, needs its Phase-A section rewritten
    # accordingly, not just this number changed.
    # UPDATE 2026-08-24: unchanged at 0.0, but now moot -- penn_enabled is
    # false, so this value is not exercised. Re-select alongside re-enabling
    # PENN, not before.
    lcb_k: 0.0
    deadlock_threshold: 5.0  # vestigial as of 2026-08-22 -- selectGamma no
